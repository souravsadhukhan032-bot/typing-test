  <g transform="translate(176, 150) scale(3.33)" stroke="url(#grad_ESIC_Employees_Insurance)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2v20M2 12h20" /><rect x="4" y="4" width="16" height="16" rx="4" />
  </g>

  <!-- Decorative Stars / Laurel Dots -->
  <circle cx="90" cy="256" r="5" fill="#15803d" />
  <circle cx="422" cy="256" r="5" fill="#15803d" />
  <circle cx="102" cy="285" r="3.5" fill="#22c55e" />
  <circle cx="410" cy="285" r="3.5" fill="#22c55e" />

