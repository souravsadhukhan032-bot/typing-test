  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="256" cy="256" r="236" fill="#ffffff" stroke="url(#grad_ESIC_Employees_Insurance)" stroke-width="12" filter="url(#shadow_ESIC_Employees_Insurance)" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="190" fill="url(#grad_ESIC_Employees_Insurance)" opacity="0.06" />

