<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_Calcutta_High_Court" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow_Calcutta_High_Court" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="256" cy="256" r="236" fill="#ffffff" stroke="url(#grad_Calcutta_High_Court)" stroke-width="12" filter="url(#shadow_Calcutta_High_Court)" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="190" fill="url(#grad_Calcutta_High_Court)" opacity="0.06" />

  <!-- Central Emblem Container -->
  <circle cx="256" cy="230" r="110" fill="#ffffff" stroke="url(#grad_Calcutta_High_Court)" stroke-width="6" />

  <!-- Central Vector Icon Graphic -->
  <g transform="translate(176, 150) scale(3.33)" stroke="url(#grad_Calcutta_High_Court)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 13l-7.5 7.5a2.12 2.12 0 11-3-3L11 10m3-3l4-4a2.12 2.12 0 113 3l-4 4m-3-3l3 3-5 5-3-3 5-5zM3 21h18" />
  </g>

  <!-- Decorative Stars / Laurel Dots -->
  <circle cx="90" cy="256" r="5" fill="#6b21a8" />
  <circle cx="422" cy="256" r="5" fill="#6b21a8" />
  <circle cx="102" cy="285" r="3.5" fill="#c084fc" />
  <circle cx="410" cy="285" r="3.5" fill="#c084fc" />

