      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow_SSC_Selection_Posts" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="256" cy="256" r="236" fill="#ffffff" stroke="url(#grad_SSC_Selection_Posts)" stroke-width="12" filter="url(#shadow_SSC_Selection_Posts)" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="256" cy="256" r="190" fill="url(#grad_SSC_Selection_Posts)" opacity="0.06" />

  <!-- Central Emblem Container -->
  <circle cx="256" cy="230" r="110" fill="#ffffff" stroke="url(#grad_SSC_Selection_Posts)" stroke-width="6" />

  <!-- Central Vector Icon Graphic -->
  <g transform="translate(176, 150) scale(3.33)" stroke="url(#grad_SSC_Selection_Posts)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" /><circle cx="12" cy="12" r="3" />
  </g>

  <!-- Decorative Stars / Laurel Dots -->
  <circle cx="90" cy="256" r="5" fill="#1e40af" />
  <circle cx="422" cy="256" r="5" fill="#1e40af" />
  <circle cx="102" cy="285" r="3.5" fill="#38bdf8" />
  <circle cx="410" cy="285" r="3.5" fill="#38bdf8" />

  <!-- Typography Labels (Royalty-Free Geometric Clean Type) -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#0f172a" letter-spacing="0.5">
    SSC SELECTION POSTS
